name: invariants
# Nightly invariant campaign (harness/INVARIANTS.md): I1-I7 over the
# nightly work list (8 profiles x 6 configs x the seeds, visited round
# robin in slices until the budget is spent).  The budget is CPU time of
# the process and its children (20 minutes by default), so the job takes
# about as long as the longest history-fuzz shard.  The job fails only on
# a contradiction or a crash outside the documented families
# (`--fail-on unsound`: class `wrong` or `crash`, not tagged `known:`;
# known families are pinned in tests/test_invariant_repros.py).  A lost
# answer (`depends`/`lost`: a definite answer against None) is reported
# only: it kept the job red every night from 8 Oct 2026 (new variants of
# the #114 families) and would have hidden a contradiction.  Every
# violation found is uploaded as an artifact with a standalone repro; the
# step summary has `python -m harness invariants-summary`, and the
# scheduled run appends it to the tracking issue (TRACKING_ISSUE) when
# anything was found.  harness/INVARIANTS.md, "Exit status".
#
# The seeds move every night (run number x 100) so successive runs cover
# new streams; `seed_offset` pins them to rerun a night's campaign.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "CPU budget in minutes (20 is the documented nightly)"
        default: "20"
      seeds:
        description: "number of seeds (the work list is visited round robin)"
        default: "3"
      seed_offset:
        description: "first seed (empty: run number x 100)"
        default: ""
      comment:
        description: "append the summary to the tracking issue (scheduled runs always do)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  MINUTES: ${{ inputs.minutes || '20' }}
  NSEEDS: ${{ inputs.seeds || '3' }}
  PYTHONHASHSEED: "0"
  TRACKING_ISSUE: "275"

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest hypothesis sympy mpmath z3-solver
      - name: invariants (nightly work list)
        id: inv
        env:
          SEED_OFFSET: ${{ inputs.seed_offset }}
        run: |
          SEED_OFFSET=${SEED_OFFSET:-$(( (GITHUB_RUN_NUMBER % 10000) * 100 ))}
          LAST=$(( SEED_OFFSET + NSEEDS - 1 ))
          echo "SEEDS=$SEED_OFFSET-$LAST" >> "$GITHUB_ENV"
          python -m harness invariants --nightly --minutes "$MINUTES" \
            --seeds "$SEED_OFFSET-$LAST" --fail-on unsound --quiet \
            --out harness-results/invariants
      - name: summary
        id: summary
        if: always()
        env:
          OUTCOME: ${{ steps.inv.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p harness-results/invariants
          python -m harness invariants-summary harness-results/invariants > body.md
          {
            echo "### invariants run #$GITHUB_RUN_NUMBER: $OUTCOME (seeds $SEEDS, $MINUTES min, \`${GITHUB_SHA::7}\`)"
            echo
            echo "$RUN_URL"
            echo
            cat body.md
          } > harness-results/invariants/SUMMARY.md
          cat harness-results/invariants/SUMMARY.md
          cat harness-results/invariants/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q "^No violations" body.md; then echo "found=0" >> "$GITHUB_OUTPUT"; else echo "found=1" >> "$GITHUB_OUTPUT"; fi
      - name: append to the tracking issue
        if: always() && steps.summary.outputs.found == '1' && (github.event_name == 'schedule' || inputs.comment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 harness-results/invariants/SUMMARY.md > comment.md
          gh issue comment "$TRACKING_ISSUE" -R "$GITHUB_REPOSITORY" --body-file comment.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants
          path: harness-results/invariants
          if-no-files-found: ignore
          retention-days: 30
