[package]
name = "sa_solver"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "sa_solver"
crate-type = ["cdylib"]

[features]
# The hash map of the block memos; see src/map.rs. Off: nothing here is tuned yet.
fxhash = []
# A single wheel per platform for all CPython versions. Step 5 reports both.
abi3 = ["pyo3/abi3-py39"]
# Deliberate faults in the rational LRA core, chosen by the env var LRA_MUT. Never for timing.
mutants = []
prof = []

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "num-bigint"] }
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"

# Never panic = "abort": a Python exception from a theory hook unwinds through the solver.
[profile.release]
panic = "unwind"

[workspace]
