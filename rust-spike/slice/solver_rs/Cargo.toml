[package]
name = "sa_solver"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "sa_solver"
crate-type = ["cdylib"]

[features]
# The hash map of the block memos; see src/map.rs. Off: nothing here is tuned yet.
fxhash = []
# A single wheel per platform for all CPython versions. Step 5 reports both.
abi3 = ["pyo3/abi3-py39"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }

# Never panic = "abort": a Python exception from a theory hook unwinds through the solver.
[profile.release]
panic = "unwind"

[workspace]
