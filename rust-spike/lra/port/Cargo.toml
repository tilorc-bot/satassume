[package]
name = "lra-replay"
version = "0.0.0"
edition = "2021"

[dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"

[features]
# Hash maps with an Fx-style hasher instead of std's SipHash (a tuning, not the first port).
fxhash = []
# Count arithmetic results by width and the structure sizes (a separate binary, never timed).
prof = []
# Deliberate port faults, chosen by the env var LRA_MUT (a separate binary, never timed).
mutants = []

[profile.release]
debug = false

[profile.tuned]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
