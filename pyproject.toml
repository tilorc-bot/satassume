[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satassume"
version = "0.1.0"
description = "An incremental SAT-based engine for SymPy's ask(): unary scalar predicates on scalar expressions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = []

[project.optional-dependencies]
sympy = ["sympy>=1.12", "mpmath"]
dev = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
include = ["satassume*", "satrefine*"]
# offline parts of satrefine (table generation, tools, test fixtures): dev-only dependencies;
# the reference handlers (satrefine.reference, selected as handlers_v3) are for measuring only
exclude = ["satrefine.build*", "satrefine.tools*", "satrefine.testing*", "satrefine.reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
