[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satassume"
dynamic = ["version"]
description = "An incremental SAT-based engine for SymPy's ask(): unary scalar predicates on scalar expressions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "satassume contributors"}]
keywords = ["sympy", "assumptions", "sat", "cdcl", "smt", "symbolic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tilorc-bot/satassume"
Source = "https://github.com/tilorc-bot/satassume"
Issues = "https://github.com/tilorc-bot/satassume/issues"
Documentation = "https://github.com/tilorc-bot/satassume/tree/main/docs"

[project.optional-dependencies]
sympy = ["sympy>=1.12", "mpmath"]
dev = ["pytest", "hypothesis"]

[tool.setuptools.dynamic]
version = {attr = "satassume.__version__"}

[tool.setuptools.packages.find]
include = ["satassume*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the root on sys.path: tests/test_history.py imports harness/ (not packaged)
pythonpath = ["."]

# The SymPy boundary (docs/design.md, "The SymPy boundary"): the shipped
# package must not reach SymPy's reasoning or simplification.  ruff runs
# only this rule (`ruff check`, CI); tools/check_sympy_boundary.py covers
# the method calls and old-assumption reads an import ban cannot see.
# A banned module bans its submodules; `from sympy import simplify` and
# `sympy.simplify(...)` resolve to the same name.
[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.per-file-ignores]
# oracles and recorders that compare against SymPy; not packaged
"tests/**" = ["TID251"]
"tools/**" = ["TID251"]
"harness/**" = ["TID251"]
"benchmarks/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sympy.simplify".msg = "SymPy simplification (module and function)"
"sympy.trigsimp".msg = "SymPy simplification"
"sympy.powsimp".msg = "SymPy simplification"
"sympy.powdenest".msg = "SymPy simplification"
"sympy.radsimp".msg = "SymPy simplification"
"sympy.ratsimp".msg = "SymPy simplification"
"sympy.combsimp".msg = "SymPy simplification"
"sympy.gammasimp".msg = "SymPy simplification"
"sympy.nsimplify".msg = "SymPy simplification"
"sympy.sqrtdenest".msg = "SymPy simplification"
"sympy.logcombine".msg = "SymPy simplification"
"sympy.signsimp".msg = "SymPy simplification"
"sympy.cancel".msg = "SymPy rational simplification"
"sympy.factor".msg = "SymPy rational simplification"
"sympy.together".msg = "SymPy rational simplification"
"sympy.gcd".msg = "SymPy polynomial algebra"
"sympy.minimal_polynomial".msg = "SymPy number fields"
"sympy.minpoly".msg = "SymPy number fields"
"sympy.solve".msg = "SymPy solvers"
"sympy.solveset".msg = "SymPy solvers"
"sympy.ask".msg = "SymPy's own ask: satassume answers by itself"
"sympy.refine".msg = "SymPy's refine reasons with SymPy's ask"
"sympy.assumptions.ask".msg = "SymPy's own ask (import Q from sympy.assumptions)"
"sympy.assumptions.refine".msg = "SymPy's refine reasons with SymPy's ask"
"sympy.assumptions.satask".msg = "SymPy's SAT ask"
"sympy.assumptions.lra_satask".msg = "SymPy's LRA ask"
"sympy.assumptions.handlers".msg = "SymPy's ask handlers"
"sympy.assumptions.sathandlers".msg = "SymPy's satask facts"
"sympy.solvers".msg = "SymPy solvers"
"sympy.polys.polytools.cancel".msg = "SymPy rational simplification"
"sympy.polys.polytools.factor".msg = "SymPy rational simplification"
"sympy.polys.polytools.gcd".msg = "SymPy polynomial algebra"
"sympy.polys.cancel".msg = "SymPy rational simplification"
"sympy.polys.factor".msg = "SymPy rational simplification"
"sympy.polys.gcd".msg = "SymPy polynomial algebra"
"sympy.polys.numberfields".msg = "SymPy number fields"
"sympy.polys.euclidtools".msg = "SymPy polynomial gcd: allowlisted in constfield only"
