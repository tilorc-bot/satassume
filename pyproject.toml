[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satassume"
version = "0.1.0"
description = "An incremental SAT-based engine for SymPy's ask(): unary scalar predicates on scalar expressions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = []

[project.optional-dependencies]
sympy = ["sympy>=1.12", "mpmath"]
dev = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
include = ["satassume*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
